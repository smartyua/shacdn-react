<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shacdn — React 19 + SCSS Component Library (shadcn/ui)</title>
    <meta
      name="description"
      content="High-fidelity React 19 component library implementing shadcn/ui design tokens using pure SCSS modules without Tailwind CSS or Radix UI."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="shacdn — React 19 + SCSS Component Library" />
    <meta
      property="og:description"
      content="High-fidelity React 19 component library implementing shadcn/ui design tokens using pure SCSS modules."
    />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var scheme = localStorage.getItem('colorScheme');
          var parts = [];
          if (theme === 'dark') parts.push('dark');
          if (scheme && scheme !== 'default') parts.push(scheme);
          if (parts.length) document.documentElement.setAttribute('data-theme', parts.join(' '));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
