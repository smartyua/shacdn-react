<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shadcn/ui React Components</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var scheme = localStorage.getItem('colorScheme');
          var parts = [];
          if (theme === 'dark') parts.push('dark');
          if (scheme && scheme !== 'default') parts.push(scheme);
          if (parts.length) document.documentElement.setAttribute('data-theme', parts.join(' '));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
